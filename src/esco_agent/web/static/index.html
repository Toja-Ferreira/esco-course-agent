<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESCO skill assistant</title>
<style>
  :root {
    --lime: #b8d331;
    --lime-soft: #eef5cf;
    --black: #000000;
    --white: #ffffff;
    --grey: #1f1f1f;
    --grey-2: #4a4a4a;
    --grey-3: #8a8a8a;
    --line: #e2e2e2;
    --paper: #f6f6f4;
    --warn: #8a5a00;
    --warn-soft: #fff4dd;
    --radius: 10px;
    --bg: var(--paper); --surface: var(--white); --text: var(--grey);
    --inverse: var(--grey); --on-inverse: var(--white);
    --field-line: #cfcfcf; --error: #b00020;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: var(--text); }

  header {
    background: var(--black); color: var(--white);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px; height: 56px; border-bottom: 4px solid var(--lime);
  }
  header .title { font-weight: 650; letter-spacing: .2px; }
  header .title span { color: var(--lime); }
  header .spacer { flex: 1; }
  header .course { color: #cfcfcf; font-size: 14px; max-width: 40vw; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600;
    background: var(--lime); color: var(--black);
  }
  .btn { transition: filter .12s, transform .06s, box-shadow .12s, background .12s; }
  .btn:hover { filter: brightness(.94); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .btn:active { transform: translateY(1px) scale(.98); filter: brightness(.88); box-shadow: none; }
  .btn:focus-visible, .chip:focus-visible, summary:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  .btn.ghost:hover { background: #1a1a1a; border-color: var(--lime); }
  .btn.outline:hover { border-color: var(--text); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  a.btn { display: inline-block; text-decoration: none; }
  .btn.dark { background: var(--inverse); color: var(--on-inverse); }
  .btn.ghost { background: transparent; color: var(--white); border: 1px solid #555; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn.outline { background: var(--surface); border: 1px solid var(--line); color: var(--text); }

  .screen { display: none; }
  .screen.on { display: block; }

  /* --- screen 1 --- */
  .card {
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line);
    max-width: 720px; margin: 40px auto; padding: 32px 36px;
  }
  .card h1 { margin: 0 0 6px; font-size: 24px; }
  .card .lead { color: var(--grey-2); margin: 0 0 24px; }
  label.field { display: block; font-weight: 600; margin: 18px 0 6px; }
  .hint { color: var(--grey-3); font-size: 13px; font-weight: 400; }
  input[type=email], input[type=text], textarea {
    width: 100%; border: 1px solid var(--field-line); border-radius: 8px; padding: 10px 12px;
    background: var(--surface);
  }
  input:focus, textarea:focus { outline: 2px solid var(--lime); border-color: var(--lime); }
  .langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .langs button { border: 0; background: var(--surface); padding: 6px 14px; cursor: pointer; }
  .langs button { transition: background .12s; }
  .langs button:hover:not(.on) { background: var(--lime-soft); }
  .langs button.on { background: var(--inverse); color: var(--on-inverse); }
  .how { margin: -8px 0 8px; padding-left: 22px; color: var(--grey-2); }
  .how li { margin: 6px 0; padding-left: 4px; }
  .how li::marker { color: var(--lime); font-weight: 800; }
  .how li.now { background: var(--lime-soft); border-radius: 8px; padding: 4px 8px; margin-left: -4px; }
  .dialog .how { margin: 0; padding: 0 22px 0 44px; }
  .dialog .asks { padding: 4px 22px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .dialog h3 { margin: 14px 22px 2px; font-size: 15px; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 24px; }
  .privacy { color: var(--grey-3); font-size: 12.5px; }

  /* --- screen 2 --- */
  /* The chat screen fills the window: the chat scrolls, the list stays in view. */
  body.chatting { overflow: hidden; }
  .work { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: calc(100vh - 60px); overflow: hidden; }
  .chatcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px 8px; scroll-behavior: smooth; }
  .msg { max-width: 760px; margin: 0 0 14px; display: flex; }
  .msg .bubble { padding: 11px 15px; border-radius: 12px; white-space: normal; overflow-wrap: anywhere; }
  .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--line); }
  .msg.user { justify-content: flex-end; margin-left: auto; }
  .msg.user .bubble { background: var(--inverse); color: var(--on-inverse); }
  .msg.user.course .bubble { position: relative; }
  .msg.user.course .bubble .clip { max-height: 7.5em; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .msg.user.course.open .bubble .clip { max-height: none; -webkit-mask-image: none; mask-image: none; }
  .msg.user.course .more { display: block; margin-top: 6px; background: none; border: 0; padding: 0;
    color: var(--lime); font-size: 13px; font-weight: 600; cursor: pointer; }
  .msg.user.course .more:hover { text-decoration: underline; }
  /* new messages rise into place: yours from the box, the assistant's a little softer */
  .msg.enter { animation: rise .24s cubic-bezier(.2, .8, .2, 1); }
  .msg.user.enter { animation-duration: .28s; transform-origin: bottom right; }
  .msg.user.enter .bubble { animation: pop .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.96); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .msg.enter, .msg.user.enter .bubble { animation: none; } }
  .msg.action { justify-content: center; max-width: none; }
  .flag { margin-top: 8px; padding: 6px 9px; border-radius: 6px; background: var(--warn-soft);
          color: var(--warn); font-size: 12.5px; }
  .msg.action .bubble { background: transparent; color: var(--grey-3); font-size: 13px; padding: 2px; }
  .bubble strong { font-weight: 650; }
  .bubble ul { margin: 6px 0; padding-left: 20px; }
  .bubble blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--lime);
                       background: var(--lime-soft); border-radius: 4px; }
  .typing .bubble { color: var(--grey-2); font-size: 14px; min-width: 260px; }
  .msg.assistant.typing .bubble { border-left: 3px solid var(--lime); }
  .steps { list-style: none; margin: 0; padding: 0; }
  .msg.stepsdone .bubble { background: transparent; border: 0; padding: 0 4px; font-size: 13px; }
  .caret::after { content: "▍"; color: var(--lime); animation: blink 1s infinite; margin-left: 1px; }
  .steps li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .steps li.done { color: var(--grey-3); }
  .steps li .ic { width: 14px; flex: none; text-align: center; }
  .steps li.done .ic { color: var(--lime); font-weight: 800; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line);
          border-top-color: var(--lime); border-right-color: var(--lime); border-radius: 50%;
          animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots .dot { display: inline-block; color: var(--lime); animation: blink 1.2s infinite; }
  .dots .dot:nth-child(2) { animation-delay: .2s; } .dots .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }

  .composer { border-top: 1px solid var(--line); background: var(--surface); padding: 12px 20px 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
          padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip { transition: background .12s, border-color .12s, transform .06s; }
  .chip:hover { border-color: var(--lime); background: var(--lime-soft); }
  .chip:active { transform: scale(.96); background: var(--lime); }
  .send { display: flex; gap: 10px; align-items: flex-end; }
  .send textarea { resize: none; min-height: 44px; max-height: 200px; }
  .keys { color: var(--grey-3); font-size: 12px; margin-top: 6px; }
  #send { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none; }
  #send svg { width: 20px; height: 20px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
             align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .overlay.on { display: flex; }
  .dialog { background: var(--surface); border-radius: var(--radius); max-width: 620px; width: 100%;
            max-height: 85vh; display: flex; flex-direction: column; border-top: 4px solid var(--lime); }
  .dialog h2 { margin: 0; padding: 18px 22px 4px; font-size: 18px; }
  .dialog .lead { padding: 0 22px; color: var(--grey-2); margin: 4px 0 10px; }
  .dialog .items { overflow-y: auto; padding: 0 22px; }
  .dialog .item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .dialog .item .label { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: var(--surface); padding: 4px 10px; font-size: 13px; cursor: pointer; transition: background .12s; }
  .seg button:hover { background: var(--lime-soft); }
  .seg button.on { background: var(--inverse); color: var(--on-inverse); }
  .seg button.on.keep { background: var(--lime); color: var(--black); }
  .dialog .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 22px 18px; }

  aside { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 18px 18px 28px; }
  aside h2 { font-size: 15px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  aside h2:first-child { margin-top: 0; }
  .count { background: var(--lime); color: var(--black); border-radius: 999px; padding: 0 9px; font-size: 13px; }
  .empty { color: var(--grey-3); font-size: 14px; }
  /* skill, text-change and occupation cards: calm hover (border and arrow), no jumping shadow */
  .skill, .change, .occ { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--surface);
                          transition: border-color .15s ease, background-color .15s ease; }
  .skill:hover, .change:hover, .occ:hover { border-color: color-mix(in srgb, var(--lime) 70%, var(--line)); }
  .skill[open], .change[open], .occ[open] { border-color: var(--lime); }
  .skill summary, .change summary, .occ summary { list-style: none; cursor: pointer; padding: 9px 12px;
    display: flex; gap: 8px; align-items: baseline; border-radius: 8px; }
  .skill summary::-webkit-details-marker, .change summary::-webkit-details-marker, .occ summary::-webkit-details-marker { display: none; }
  .skill summary:active, .change summary:active, .occ summary:active { background: var(--lime-soft); }
  .skill summary::after, .change summary::after, .occ summary::after { content: "›"; color: var(--grey-3); font-size: 18px;
    line-height: 1; margin-left: 4px; transition: transform .18s ease, color .15s; }
  .skill:hover summary::after, .change:hover summary::after, .occ:hover summary::after { color: var(--lime); }
  .skill[open] summary::after, .change[open] summary::after, .occ[open] summary::after { transform: rotate(90deg); color: var(--lime); }
  .skill:focus-within, .change:focus-within, .occ:focus-within { outline: none; }
  summary:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 30% { background: var(--lime-soft); border-color: var(--lime); } 100% { background: var(--surface); } }
  .skill.accepted { border-left: 4px solid var(--lime); }
  .num { font-variant-numeric: tabular-nums; color: var(--grey-3); min-width: 22px; }
  .skill .label { font-weight: 600; flex: 1; }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .skill .body { padding: 0 12px 12px 40px; font-size: 13.5px; color: var(--grey-2); }
  .skill .body p { margin: 6px 0; }
  .skill .quote { border-left: 3px solid var(--lime); padding-left: 8px; margin: 6px 0; color: var(--text); }
  .skill .quote small { color: var(--grey-3); }
  .skill .actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .skill .actions a { margin-left: auto; font-size: 13px; }
  details.rejected > summary { cursor: pointer; color: var(--grey-3); font-size: 14px; margin-top: 16px; }
  .change .st { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
                background: var(--bg); color: var(--grey-2); border: 1px solid var(--line); }
  .change.st-accepted .st { background: var(--lime); color: var(--black); border-color: var(--lime); }
  .change.st-proposed .st { background: var(--lime-soft); color: var(--text); border-color: var(--lime); }
  .change.st-failed .st { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .change.st-rejected { opacity: .75; }
  .change .label, .occ .label { font-weight: 600; flex: 1; }
  .change .kind { display: block; font-size: 12px; font-weight: 400; color: var(--grey-3); margin-top: 1px; }
  .change .body, .occ .body { padding: 0 14px 12px; font-size: 13.5px; color: var(--grey-2); }
  .change .body .what { color: var(--text); margin: 2px 0 8px; }
  .change dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0 0 6px; }
  .change dt { color: var(--grey-3); }
  .change dd { margin: 0; color: var(--text); }
  .change .h, .occ .h { margin: 8px 0 2px; font-weight: 600; color: var(--text); }
  .occ .h2 { margin: 6px 0 0; color: var(--grey-3); }
  .change .txt { border-left: 3px solid var(--lime); padding: 2px 0 2px 10px; color: var(--text); white-space: pre-wrap; }
  .change ul, .occ ul { margin: 2px 0 4px; padding-left: 18px; }
  .change .check { font-size: 12.5px; margin: 8px 0 0; }
  .change .check.ok::before { content: "✓ "; color: var(--lime); font-weight: 800; }
  .change .check.bad::before { content: "✕ "; color: var(--warn); font-weight: 800; }
  .change .why { color: var(--warn); font-size: 12.5px; margin: 4px 0 0; }
  .occ .num { color: var(--grey-3); }
  .occ .actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .occ .actions a { margin-left: auto; font-size: 13px; }
  .occlead { margin: -4px 0 8px; }
  /* skill / occupation names in replies: open them in the panel */
  button.ref { all: unset; cursor: pointer; color: inherit; font-weight: inherit;
               text-decoration: underline; text-decoration-color: var(--lime); text-decoration-thickness: 2px;
               text-underline-offset: 3px; border-radius: 3px; transition: background-color .12s; }
  button.ref:hover { background: var(--lime-soft); }
  button.ref:focus-visible { outline: 2px solid var(--lime); }

  /* --- screen 3 --- */
  .review { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px); }
  .review aside { border-left: 0; border-right: 1px solid var(--line); }
  .review aside ol, .review aside ul { padding-left: 20px; margin: 4px 0 12px; }
  .review .pre { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .review .log { max-height: 340px; overflow-y: auto; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .review .log p { margin: 0 0 8px; }
  .form { padding: 24px 32px 60px; max-width: 900px; }
  .form h2 { margin: 26px 0 4px; font-size: 18px; }
  .q { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .q .text { margin-bottom: 8px; }
  .likert { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .likert .end { font-size: 12px; color: var(--grey-3); }
  .likert label { display: inline-flex; }
  .likert input { display: none; }
  .likert span { display: inline-block; min-width: 38px; text-align: center; padding: 5px 0;
                 border: 1px solid var(--field-line); border-radius: 6px; cursor: pointer; }
  .likert span { transition: background .1s, border-color .1s, transform .06s; }
  .likert span:hover { border-color: var(--lime); background: var(--lime-soft); }
  .likert span:active { transform: scale(.94); }
  .likert input:checked + span { background: var(--inverse); color: var(--on-inverse); border-color: var(--text); }
  .likert .na span { min-width: auto; padding: 5px 10px; font-size: 13px; }
  .q.missing .text { color: var(--error); }

  .chat, aside, .review .log { scrollbar-color: var(--lime) transparent; scrollbar-width: thin; }
  .chat::-webkit-scrollbar, aside::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb, aside::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 8px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
           background: var(--inverse); color: var(--on-inverse); padding: 10px 16px; border-radius: 8px;
           border-left: 4px solid var(--lime); max-width: 90vw; display: none; z-index: 10; }
  .done { text-align: center; }
  .done .result { text-align: left; white-space: pre-wrap; margin: 18px 0; max-height: 50vh; overflow-y: auto;
                  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 14px; }

  /* inside POF's page (?embed=1): POF's font, spacing, page title, light/dark theme and language */
  .embedbar { display: none; }
  body.embed { --radius: 16px; --paper: #ffffff; --bg: #ffffff; --bar: 104px;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px; }
  body.embed header, body.embed .langs { display: none; }
  /* POF's sidebar widens over the page on hover, so, like POF's pages, the content sits in a
     centred column with POF's side padding (24 / 48 / 64 px) */
  body.embed { --gutter: max(64px, calc((100vw - 1280px) / 2)); --gl: var(--gutter); --gr: var(--gutter); }
  @media (max-width: 1023px) { body.embed { --gutter: 48px; } }
  @media (max-width: 767px) { body.embed { --gutter: 24px; } }
  /* --gl / --gr are set from POF's window size (centreInPof), so the column is centred
     on the whole page, like POF's own tabs, whatever the sidebar takes */
  body.embed .embedbar { display: flex; align-items: flex-end; gap: 16px; height: var(--bar);
                         padding: 0 var(--gr) 16px var(--gl); border-bottom: 1px solid var(--line); background: var(--bg); }
  body.embed .embedbar .titles { flex: 1; min-width: 0; }
  body.embed .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--grey-2); }
  body.embed .embedbar h1 { margin: 4px 0 0; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -.02em;
                            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.embed .embedbar .course { color: var(--grey-2); font-size: 14px; max-width: 34vw; margin-bottom: 4px;
                                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.embed .embedbar #finish { background: var(--lime-soft); color: var(--text); border: 1px solid var(--lime);
                                 border-radius: 999px; padding: 6px 16px; font-size: 14px; }
  body.embed .embedbar #help { background: transparent; color: var(--text); border: 1px solid var(--line);
                               border-radius: 999px; padding: 6px 16px; font-size: 14px; }
  body.embed .embedbar #help:hover { border-color: var(--lime); background: var(--lime-soft); }
  body.embed .embedbar #finish:hover { background: var(--lime); color: var(--black); }
  body.embed .work { height: calc(100vh - var(--bar)); }
  body.embed .review { min-height: calc(100vh - var(--bar)); }
  body.embed .card { margin: 40px var(--gr) 40px var(--gl); max-width: none; border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.04);
                     background: var(--card); }
  body.embed .work, body.embed .review { padding: 0 var(--gr) 0 var(--gl); }
  body.embed .chat { padding: 28px 28px 8px 0; }
  body.embed .composer { background: transparent; padding: 12px 28px 14px 0; }
  body.embed .work aside { border-right: 1px solid var(--line); }
  body.embed .msg .bubble, body.embed .skill, body.embed .change, body.embed .occ, body.embed .dialog { border-radius: var(--radius); }
  body.embed aside { background: var(--card); }
  body.embed .btn, body.embed .chip { border-radius: 999px; }
  body.embed #send { border-radius: 50%; }
  body.embed { --card: #fafafa; }
  /* larger text, in line with POF's pages */
  body.embed { font-size: 17px; line-height: 1.55; }
  body.embed .eyebrow { font-size: 13px; }
  body.embed .embedbar h1 { font-size: 36px; line-height: 42px; }
  body.embed { --bar: 116px; }
  body.embed .card { padding: 36px 40px; }
  body.embed .card h1 { font-size: 30px; }
  body.embed #expected { height: 150px; }
  body.embed .card .lead, body.embed .how { font-size: 17px; }
  body.embed label.field { font-size: 17px; }
  body.embed .hint, body.embed .privacy { font-size: 14.5px; }

function stepText(p) {
  // the model is called again after each tool: say so instead of repeating "Thinking"
  if (p.stage === "thinking" && steps.length) return lang === "pt" ? "A preparar a resposta" : "Preparing the answer";
  const f = STEPS[lang][p.stage]; return f ? (typeof f === "function" ? f(p) : f) : null;

let me = { login_required: false, logged_in: false, first_name: "" };
let lang = "pt", session = null, stage = null, chip = null, busy = false, panelState = { skills: [], text_changes: [], occupations: [] };
const $ = id => document.getElementById(id);
const t = () => T[lang];

// --- helpers ---
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function md(text) {
  // a small, safe subset: **bold**, "- " lists, "> " quotes, paragraphs
  const lines = esc(text).split("\n"); let html = "", list = false;
  for (const raw of lines) {
    let ln = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const bullet = ln.match(/^\s*[-•]\s+(.*)/);
    if (bullet) { if (!list) { html += "<ul>"; list = true; } html += `<li>${bullet[1]}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (/^&gt;\s?/.test(ln)) html += `<blockquote>${ln.replace(/^&gt;\s?/, "")}</blockquote>`;
    else html += ln.trim() ? ln + "<br>" : "<br>";
  }
  if (list) html += "</ul>";
  return html.replace(/(<br>)+$/, "");
}
function toast(msg) { const el = $("toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 6000); }
// Inside POF's page (?embed=1, or any frame): POF's header replaces ours, so the course
// name and "Finish" move above the chat, and logins open in the whole window.
const EMBED = new URLSearchParams(location.search).has("embed") || window.self !== window.top;
if (EMBED) {
  document.body.classList.add("embed");
  $("embedbar").append($("course-name"), $("help"), $("finish"));
}
// Follow POF's light/dark theme and PT/EN choice, now and whenever the teacher changes them.
// The conversation keeps the language it started in; only the page's own text switches.
function followPof() {
  let root = null;
  try { root = window.top.document.documentElement; } catch (e) { return; }   // not on POF's address
  const sync = () => {
    document.body.classList.toggle("dark", root.classList.contains("dark") || root.dataset.theme === "dark" || root.style.colorScheme === "dark");
    let l = null;
    try { l = localStorage.getItem("pof-language"); } catch (e) { /* storage blocked */ }
    l = l || (root.lang || "").slice(0, 2);
    if ((l === "pt" || l === "en") && l !== lang) { lang = l; applyLang(); }
  };
  sync();
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["class", "lang", "data-theme"] });
  window.addEventListener("storage", e => { if (e.key === "pof-language") sync(); });
}
// Centre the content on POF's whole window, as POF's own pages are (max 1280px wide, at
// least POF's side padding), measuring where this frame sits inside POF's page.
function centreInPof() {
  try {
    const frame = window.frameElement, top = window.top;
    if (!frame) return;
    const r = frame.getBoundingClientRect(), W = top.innerWidth;
    const pad = W >= 1024 ? 64 : W >= 768 ? 48 : 24, side = Math.max(0, (W - 1280) / 2);
    const left = Math.max(pad, side - r.left), right = Math.max(pad, side - (W - r.right));
    document.body.style.setProperty("--gl", left + "px");
    document.body.style.setProperty("--gr", right + "px");
  } catch (e) { /* not on POF's address: keep the CSS defaults */ }
}
if (EMBED) {
  centreInPof();
  window.addEventListener("resize", centreInPof);
  try { window.top.addEventListener("resize", centreInPof); } catch (e) { /* other address */ }
}
function goTo(url) { (EMBED ? window.top : window).location.href = url; }
// With POF's login the browser already holds POF's token (same address); send it along.
function authHeaders() {
  let token = null;
  try { token = me.mode === "pof" ? localStorage.getItem("access") : null; } catch (e) { /* storage blocked */ }
  return token ? { Authorization: `Bearer ${token}` } : {};
}
async function refreshPof() {
  // POF's own refresh endpoint, as POF's pages do; false if the login has expired
  try {
    const refresh = localStorage.getItem("refresh"); if (!refresh) return false;
    const r = await fetch("/api/token/refresh/", { method: "POST", headers: { "Content-Type": "application/json" },
                                                    body: JSON.stringify({ refresh }) });
    if (!r.ok) return false;
    const d = await r.json(); if (!d.access) return false;
    localStorage.setItem("access", d.access); return true;
  } catch (e) { return false; }
}
async function authFetch(path, opts = {}, retried = false) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...authHeaders() } });
  if (r.status === 401 && me.mode === "pof" && !retried) {
    if (await refreshPof()) return authFetch(path, opts, true);
    goTo(me.login_url); throw new Error("Login expired.");
  }
  return r;
}
async function api(path, body) {
  const r = await authFetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `Error ${r.status}`);
  return data;
}

function renderPanel() {

  const openOcc = new Set([...p.querySelectorAll("details.occ[open]")].map(d => d.dataset.o));
  const rejOpen = !!p.querySelector("details.rejected[open]");

function linkifyChat() {
  const refs = [];

  for (const o of panelState.occupations || []) if (o.label.length >= 4) refs.push({ label: o.label, kind: "o", id: o.rank });
  if (!refs.length) return;
  refs.sort((a, b) => b.label.length - a.label.length);
  const byLabel = new Map(refs.map(r => [r.label.toLowerCase(), r]));
  const rx = new RegExp("(?:\\b\\d{1,2}\\.\\s*)?(?<![\\w-])(" +
    refs.map(r => r.label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(?![\\w-])", "gi");
  document.querySelectorAll("#chat .msg.assistant:not(.typing):not(.streaming) .bubble, #chat .msg.action .bubble").forEach(b => {

      acceptNode: n => n.parentElement.closest(".ref, a, code, .flag") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });

      while ((m = rx.exec(text))) {

        const btn = document.createElement("button");
        btn.className = "ref"; btn.dataset[r.kind] = r.id; btn.textContent = m[0];
        frag.append(btn); last = m.index + m[0].length;

    d.innerHTML = `<h2>${pending.length ? s.finishTitle : s.finish}</h2>
      <p class="lead">${pending.length ? s.finishLead(pending.length) : esc(s.confirmFinish)}</p>
      <div class="items">${pending.map(k => `<div class="item"><span class="num">${k.number}.</span>
        <span class="label">${esc(k.label)}</span><span class="seg" data-n="${k.number}">
        <button data-c="accept" class="keep ${choice[k.number] === "accept" ? "on" : ""}">${s.keep}</button>
        <button data-c="reject" class="${choice[k.number] === "reject" ? "on" : ""}">${s.remove}</button>
        <button data-c="" class="${choice[k.number] === null ? "on" : ""}">${s.undecided}</button></span></div>`).join("")}</div>
      <div class="foot">${pending.length ? `<button class="btn small outline" id="all-keep">${s.keepAll}</button>
        <button class="btn small outline" id="all-remove">${s.removeAll}</button>` : ""}
        <span style="flex:1"></span><button class="btn small outline" id="d-cancel">${s.cancel}</button>
        <button class="btn small" id="d-go">${s.goOn}</button></div>`;
    d.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
      choice[b.parentElement.dataset.n] = b.dataset.c || null; draw(); });
    if (pending.length) {
      $("all-keep").onclick = () => { pending.forEach(k => choice[k.number] = "accept"); draw(); };
      $("all-remove").onclick = () => { pending.forEach(k => choice[k.number] = "reject"); draw(); };
    }
    $("d-cancel").onclick = closeDialog;
    $("d-go").onclick = () => finishSession(choice);
  }
  draw(); $("overlay").classList.add("on");
});
async function finishSession(choice) {
  busy = true;
  try {
    for (const [n, action] of Object.entries(choice)) {
      if (action) await api("api/skill", { session, number: Number(n), action, source: "finish" });
    }
    closeDialog();
    const r = await api("api/finish", { session });
    $("s2").classList.remove("on"); $("s3").classList.add("on"); $("finish").style.display = "none"; $("help").style.display = "none";
    document.body.classList.remove("chatting");
    renderReview(r);
  } catch (e) { toast(e.message); }
  busy = false;
}
function likert(name, na) {
  let h = `<div class="likert">`;
  for (let i = 1; i <= 5; i++) h += `<label><input type="radio" name="${name}" value="${i}"><span>${i}</span></label>`;
  if (na) h += `<label class="na"><input type="radio" name="${name}" value="na"><span>${esc(na)}</span></label>`;
  return h + "</div>";
}
let review = null, submitted = false;
function formValues() {
  const v = {};
  document.querySelectorAll("#form input:checked").forEach(x => v[x.name] = x.value);
  document.querySelectorAll("#form [data-open]").forEach(x => v["open:" + x.dataset.open] = x.value);
  return v;
}
function restoreValues(v) {
  Object.entries(v).forEach(([k, val]) => {
    if (k.startsWith("open:")) { const el = document.querySelector(`#form [data-open="${k.slice(5)}"]`); if (el) el.value = val; }
    else { const el = document.querySelector(`#form input[name="${k}"][value="${val}"]`); if (el) el.checked = true; }
  });
}
function renderReview(r) {
  review = r;
  const s = t(); const q = (r.questions_by_language || {})[lang] || r.questions;
  $("recap").innerHTML = `
    <h2>${s.recapExpected}</h2><div class="pre">${esc(r.expected)}</div>
    <h2>${s.recapList} <span class="count">${r.skills.length}</span></h2>
    <ol>${r.skills.map(k => `<li>${esc(k.label)}${k.in_text ? "" : ` <span class="tag warn">${s.notInText}</span>`}</li>`).join("")}</ol>
    <h2>${s.recapLog}</h2>
    <div class="log">${r.chat.filter(m => m.role !== "action").map(m => `<p><strong>${m.role === "user" ? s.you : s.assistant}:</strong> ${md(m.content)}</p>`).join("")}</div>`;
  const scale = `<div class="hint">1 = ${esc(q.scale[0])} · 5 = ${esc(q.scale[1])}</div>`;
  $("form").innerHTML = `
    <h1 style="margin:0">${s.formTitle}</h1><p class="lead">${s.formLead}</p>
    <h2>${s.susTitle}</h2>${scale}
    ${q.sus.map((txt, i) => `<div class="q" data-q="sus${i}"><div class="text">${i + 1}. ${esc(txt)}</div>${likert("sus" + i)}</div>`).join("")}
    <h2>${s.statementsTitle}</h2>${scale}
    ${q.statements.map(st => `<div class="q" data-q="st_${st.key}"><div class="text">${esc(st.text)}</div>${likert("st_" + st.key, st.na)}</div>`).join("")}
    <h2>${s.openTitle}</h2>
    ${q.open.map(o => `<div class="q"><div class="text">${esc(o.text)}</div><textarea rows="3" data-open="${o.key}"></textarea></div>`).join("")}
    <div class="row"><span></span><button class="btn" id="submit">${s.submit}</button></div>`;
  $("submit").onclick = () => submitAnswers(q);
}
// the closing page follows a language switch (POF's), keeping what was already answered
function rerenderReview() {
  if (!review || submitted || !$("s3").classList.contains("on")) return;
  const v = formValues(); renderReview(review); restoreValues(v);
}
// What the teacher keeps: the final list with ESCO links and the text changes they accepted
function resultText() {
  const s = t(), r = review;
  let out = `${r.course_name || ""}\n\n${s.resultList}\n` +
    r.skills.map(k => `- ${k.label}${k.in_text ? "" : ` (${s.notInText})`}: ${k.url}`).join("\n");
  if ((r.text_changes || []).length)
    out += `\n\n${s.resultChanges}\n` + r.text_changes.map(c => `- ${c.label} (${c.section}): ${c.text}`).join("\n");
  return out.trim();
}
async function submitAnswers(q) {
  const val = n => { const x = document.querySelector(`input[name="${n}"]:checked`); return x ? (x.value === "na" ? "na" : Number(x.value)) : null; };
  let missing = false;
  document.querySelectorAll(".q[data-q]").forEach(el => { const ok = val(el.dataset.q) !== null; el.classList.toggle("missing", !ok); missing ||= !ok; });
  if (missing) { toast(t().missing); return; }
  const body = { session, language: lang, sus: q.sus.map((_, i) => val("sus" + i)),
    statements: Object.fromEntries(q.statements.map(st => [st.key, val("st_" + st.key)])),
    open: Object.fromEntries([...document.querySelectorAll("[data-open]")].map(el => [el.dataset.open, el.value])) };
  try {
    await api("api/answers", body);
    submitted = true;
    $("form").innerHTML = `<div class="done"><h1>${t().thanks}</h1><p class="lead">${t().thanksLead}</p>
      <div class="pre result" id="result"></div>
      <button class="btn" id="copy">${t().copy}</button></div>`;
    $("result").textContent = resultText();
    $("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(resultText()); toast(t().copied); }
      catch (e) { const range = document.createRange(); range.selectNodeContents($("result"));
                  getSelection().removeAllRanges(); getSelection().addRange(range); }
    };
  } catch (e) { toast(e.message); }
}

// Which first screen: the university login, or "before you start".
(async () => {
  try {
    const mode = (await (await fetch("api/me")).json());        // which login, before sending any token
    me = mode;
    if (mode.mode === "pof") {
      let r = await fetch("api/me", { headers: authHeaders() });
      me = await r.json();
      if (!me.logged_in && await refreshPof()) me = await (await fetch("api/me", { headers: authHeaders() })).json();
      if (!me.logged_in) { goTo(me.login_url); return; }
    }
  } catch (e) { /* no login info: assume off */ }
  $("logout").href = me.logout_url || "auth/logout";
  if (me.login_required && (!me.logged_in || !me.allowed)) {
    $("s0").classList.add("on");
    if (me.error) $("login-error").textContent = me.error;
    if (me.mode === "pof") { $("t-login-btn").href = "/pof/"; $("t-login-btn").dataset.pof = "1"; }
    if (EMBED) $("t-login-btn").target = "_top";
  } else {
    $("s1").classList.add("on");
    if (me.logged_in) { $("email-block").style.display = "none"; $("logout").style.display = ""; }
  }
  applyLang(); if (EMBED) followPof(); canStart();
})();
</script>
